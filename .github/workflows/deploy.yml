name: CI/CD - Build & Deploy Client (Cloudflare Workers)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-cloudflare:
    name: Build & Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build OpenNext Cloudflare Worker bundle
        env:
          NEXT_PUBLIC_API_URL: https://api.dailydevops.blog
          NEXT_PUBLIC_SITE_URL: https://dailydevops.blog
          NEXT_PUBLIC_APP_URL: https://dailydevops.blog
          NEXT_PUBLIC_APP_ENV: production
        run: npm run build:cf

      - name: Verify Cloudflare API Token Secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing in GitHub Repository Settings -> Secrets and variables -> Actions"
            exit 1
          fi

      - name: Deploy Web Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '4c87e4e13d3136e7c56c2009e1963a3a' }}
        run: npx wrangler deploy
