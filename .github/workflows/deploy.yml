name: CI/CD - Build & Deploy Client (Cloudflare Workers)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-cloudflare:
    name: Build & Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build OpenNext & Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '4c87e4e13d3136e7c56c2009e1963a3a' }}
          NEXT_PUBLIC_API_URL: https://api.dailydevops.blog
          NEXT_PUBLIC_SITE_URL: https://dailydevops.blog
        run: npm run deploy:cf
